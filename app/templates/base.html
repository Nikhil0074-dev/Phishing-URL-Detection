<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phishing URL Detection{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block styles %}{% endblock %}
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="{{ url_for('index') }}">
      <span class="wordmark-mark"></span>
      URL Classifier
    </a>
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="{{ 'is-current' if request.endpoint == 'index' }}">Check a URL</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'is-current' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('models') }}" class="{{ 'is-current' if request.endpoint == 'models' }}">Models</a>
      <a href="{{ url_for('analysis') }}" class="{{ 'is-current' if request.endpoint == 'analysis' }}">Features</a>
      <a href="{{ url_for('predictions') }}" class="{{ 'is-current' if request.endpoint == 'predictions' }}">History</a>
      <a href="{{ url_for('reports') }}" class="{{ 'is-current' if request.endpoint == 'reports' }}">Reports</a>
    </nav>
  </header>

  <main class="shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>
    </p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
